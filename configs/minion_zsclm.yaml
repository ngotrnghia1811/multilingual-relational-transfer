transfer_mode: zsclm
log_dir: logs/minion_zsclm/
output_dir: checkpoints/minion_zsclm/

model:
  bert_model_name: xlm-roberta-base
  bert_cache_dir: null
  bert_dropout: 0.1
  hidden_dim: 256
  multi_piece_strategy: first

train:
  bert_learning_rate: 1.0e-5
  learning_rate: 1.0e-3
  bert_weight_decay: 1.0e-5
  weight_decay: 1.0e-3
  batch_size: 16
  eval_batch_size: 16
  max_epoch: 50
  warmup_epoch: 5
  grad_clipping: 5.0
  accumulate_step: 1
  seed: 42

data:
  data_dir: data/minion/
  task: event_detection
  # MINION clusters (d_comb k-medoids, k=2):
  #   tur*: kor, hin, jpn, tur  (medoid: tur)
  #   por*: eng, pol, spa, por, swe  (medoid: por)
  # Inter-cluster (medoids*): 2 source languages — tur + por
  source_languages:
    - tur
    - por
  target_languages:
    - eng
    - hin
    - jpn
    - kor
    - pol
    - por
    - spa
    - swe
    - tur
  all_languages:
    - eng
    - hin
    - jpn
    - kor
    - pol
    - por
    - spa
    - swe
    - tur
  max_length: 128
  use_gpu: true
  gpu_device: 0
