transfer_mode: zscls
log_dir: logs/smiler_zscls/
output_dir: checkpoints/smiler_zscls/

model:
  bert_model_name: xlm-roberta-base
  bert_cache_dir: null
  bert_dropout: 0.1
  hidden_dim: 256
  multi_piece_strategy: first

train:
  bert_learning_rate: 1.0e-5
  learning_rate: 1.0e-3
  bert_weight_decay: 1.0e-5
  weight_decay: 1.0e-3
  batch_size: 16
  eval_batch_size: 16
  max_epoch: 50
  warmup_epoch: 5
  grad_clipping: 5.0
  accumulate_step: 1
  seed: 42

data:
  data_dir: data/smiler/
  task: relation_extraction
  # Single source language — set via CLI argument: --source <lang>
  # Available: ara, deu, eng, fas, fra, hin, ita, jpn, kor, nld, pol, por, rus, spa
  source_languages:
    - eng
  target_languages:
    - ara
    - deu
    - fas
    - fra
    - hin
    - ita
    - jpn
    - kor
    - nld
    - pol
    - por
    - rus
    - spa
  all_languages:
    - ara
    - deu
    - eng
    - fas
    - fra
    - hin
    - ita
    - jpn
    - kor
    - nld
    - pol
    - por
    - rus
    - spa
  max_length: 128
  use_gpu: true
  gpu_device: 0
