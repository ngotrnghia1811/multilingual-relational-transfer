transfer_mode: zsclr
log_dir: logs/smiler_zsclr/
output_dir: checkpoints/smiler_zsclr/

model:
  bert_model_name: xlm-roberta-base
  bert_cache_dir: null
  bert_dropout: 0.1
  hidden_dim: 256
  multi_piece_strategy: first

train:
  bert_learning_rate: 1.0e-5
  learning_rate: 1.0e-3
  bert_weight_decay: 1.0e-5
  weight_decay: 1.0e-3
  batch_size: 16
  eval_batch_size: 16
  max_epoch: 50
  warmup_epoch: 5
  grad_clipping: 5.0
  accumulate_step: 1
  seed: 42

data:
  data_dir: data/smiler/
  task: relation_extraction
  # Source languages (labeled): medoids from d_comb clustering
  source_languages:
    - ita
    - nld
    - fas
  # All languages provide unlabeled data for GrDA adversarial training
  all_languages:
    - ara
    - deu
    - eng
    - fas
    - fra
    - hin
    - ita
    - jpn
    - kor
    - nld
    - pol
    - por
    - rus
    - spa
  target_languages:
    - ara
    - deu
    - eng
    - fas
    - fra
    - hin
    - ita
    - jpn
    - kor
    - nld
    - pol
    - por
    - rus
    - spa
  max_length: 128
  use_gpu: true
  gpu_device: 0

# GrDA: Graph-relational Domain Adaptation
grda:
  lambda_gan: 0.1
  lr_e: 1.0e-4
  lr_d: 1.0e-4
  lr_g: 1.0e-4
  z_dim: 64
  hidden_dim: 128
  sample_v: 4
  sample_v_g: 4
  num_epoch_pretrain_g: 10
